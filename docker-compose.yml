services:
  iris:
    build:
      context: .
      target: iris
    restart: unless-stopped
    ports:
      - "1972:1972"
      - "52773:52773"
    volumes:
      - iris-data:/data
    environment:
      IRIS_SQL_SCHEMA: IRISPolitical_Model
      TSE_DATASET_ID: ${TSE_DATASET_ID:-candidatos-2026}
      INGEST_ELECTION_YEAR: ${INGEST_ELECTION_YEAR:-2026}
      INGEST_STATES: ${INGEST_STATES:-SP}
      INGEST_OFFICES: ${INGEST_OFFICES:-DEPUTADO FEDERAL,GOVERNADOR}
      CAMARA_LOOKBACK_YEARS: ${CAMARA_LOOKBACK_YEARS:-4}
      CAMARA_MAX_MATCHED_CANDIDATES: ${CAMARA_MAX_MATCHED_CANDIDATES:-50}
      CAMARA_MAX_PROPOSITIONS_PER_CANDIDATE: ${CAMARA_MAX_PROPOSITIONS_PER_CANDIDATE:-50}
      CAMARA_MAX_AUTHORS_PER_PROPOSITION: ${CAMARA_MAX_AUTHORS_PER_PROPOSITION:-10}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-50}
    healthcheck:
      test: ["CMD-SHELL", "iris qlist IRIS | grep -q running"]
      interval: 10s
      timeout: 5s
      retries: 12

  ui:
    build:
      context: .
      target: ui
    restart: unless-stopped
    command:
      - streamlit
      - run
      - app/ui/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      API_BASE_URL: http://iris:52773/api
    depends_on:
      iris:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  iris-data:
